<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090e18">
  <meta name="description" content="برنامه‌ریز شخصی ددلاین‌ها، امتحان‌ها و کوییزها با تقویم ماهانهٔ شمسی.">
  <title>DeadTime — برنامه‌ریز شخصی</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./theme.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M6 3h12M6 21h12M7 3v4c0 3 5 3 5 5s-5 2-5 5v4m10-18v4c0 3-5 3-5 5s5 2 5 5v4"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 5h2m4 0h2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3m-5 5 5-5 5 5M4 16v4h16v-4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Zm0 0v6h6M8 13h8m-8 4h5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m10.3 4-8 14a2 2 0 0 0 1.7 3h16a2 2 0 0 0 1.7-3l-8-14a2 2 0 0 0-3.4 0ZM12 9v4m0 4h.01"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
  </defs></svg>
  <a class="skip-link" href="#main">رفتن به محتوای اصلی</a>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="./" aria-label="DeadTime، صفحهٔ اصلی"><span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span><span dir="ltr">DeadTime</span></a>
      <nav aria-label="منوی اصلی">
        <button class="nav-item active" data-view="active" aria-current="page"><svg class="icon"><use href="#i-grid"/></svg> نمای کلی <b id="nav-count">۰</b></button>
        <button class="nav-item" data-view="month"><svg class="icon"><use href="#i-calendar"/></svg> برنامهٔ ماه</button>
        <button class="nav-item" data-view="completed"><svg class="icon"><use href="#i-check"/></svg> انجام‌شده‌ها <b id="completed-nav-count">۰</b></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" id="export-button" title="دریافت پشتیبان"><svg class="icon"><use href="#i-download"/></svg> دریافت پشتیبان</button>
        <button class="nav-item" id="import-button" title="بازیابی پشتیبان"><svg class="icon"><use href="#i-upload"/></svg> بازیابی پشتیبان</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
    </aside>
    <main id="main" tabindex="-1">
      <header class="topbar"><span>برنامه‌ریز <span class="breadcrumb">/</span> <strong id="breadcrumb-current">نمای کلی</strong></span><span class="today"><svg class="icon"><use href="#i-calendar"/></svg><span id="today"></span></span></header>
      <div class="main-content">
        <section class="page-heading"><h1>ددلاین‌ها</h1><button class="button primary" id="add-button"><svg class="icon"><use href="#i-plus"/></svg> افزودن ددلاین <kbd>N</kbd></button></section>
        <section class="stats" aria-label="خلاصهٔ وضعیت ددلاین‌ها">
          <div class="stat-card"><div><span class="stat-label">در حال انجام</span><span class="stat-symbol violet"><svg class="icon"><use href="#i-file"/></svg></span></div><strong id="active-count">۰</strong></div>
          <div class="stat-card"><div><span class="stat-label" id="month-stat-label">این ماه</span><span class="stat-symbol amber"><svg class="icon"><use href="#i-calendar"/></svg></span></div><strong id="month-count">۰</strong></div>
          <div class="stat-card"><div><span class="stat-label">گذشته از موعد</span><span class="stat-symbol rose"><svg class="icon"><use href="#i-alert"/></svg></span></div><strong id="overdue-count">۰</strong></div>
          <div class="stat-card"><div><span class="stat-label">انجام‌شده</span><span class="stat-symbol mint"><svg class="icon"><use href="#i-check"/></svg></span></div><strong id="complete-count">۰</strong></div>
        </section>
        <div class="dashboard-grid">
          <section class="assignments-panel" aria-labelledby="list-title">
            <div class="panel-heading"><h2 id="list-title">ددلاین‌ها <span id="list-count">۰</span></h2><span class="sort-label">نزدیک‌ترین موعد</span></div>
            <div class="toolbar"><div class="tabs" aria-label="فیلتر وضعیت"><button class="tab active" data-filter="all" aria-pressed="true">همه</button><button class="tab" data-filter="upcoming" aria-pressed="false">پیش رو</button><button class="tab" data-filter="overdue" aria-pressed="false">عقب‌افتاده</button></div><label class="search"><svg class="icon"><use href="#i-search"/></svg><input id="search" type="search" placeholder="جست‌وجوی ددلاین…" aria-label="جست‌وجوی ددلاین"><kbd>/</kbd></label></div>
            <div class="date-filter" id="date-filter" hidden><span id="date-filter-label"></span><button id="clear-date-filter" type="button">نمایش همه ×</button></div>
            <div id="assignment-list" class="assignment-list" aria-label="فهرست ددلاین‌ها" aria-live="polite"></div>
            <div class="list-footer"><span><span class="status-dot"></span> <span id="storage-status">ذخیره در این مرورگر</span></span><svg class="icon"><use href="#i-lock"/></svg></div>
          </section>
          <aside class="right-column" aria-label="برنامه و پیشرفت">
            <section class="month-panel" aria-label="تقویم ماهانه"><div class="month-heading"><h3 id="month-title" aria-live="polite"></h3><div class="month-navigation"><button type="button" id="previous-month" aria-label="ماه قبل">‹</button><button type="button" id="next-month" aria-label="ماه بعد">›</button></div></div><div class="month-weekdays" aria-hidden="true"><span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span></div><div class="month-calendar" id="month-calendar" aria-label="روزهای ماه"></div><div class="calendar-footer"><div class="calendar-legend"><span><i class="legend-deadline"></i>ددلاین</span><span><i class="legend-exam"></i>امتحان</span><span><i class="legend-quiz"></i>کوییز</span></div><button type="button" id="current-month">ماه جاری</button></div></section>
            <section class="next-card"><div class="eyebrow"><span class="live-dot"></span> ددلاین بعدی</div><div id="next-assignment"></div></section>
            <section class="progress-panel"><div class="week-heading"><h3>پیشرفت</h3><svg class="icon"><use href="#i-check"/></svg></div><div class="progress-detail"><span id="progress-label">۰ از ۰ ددلاین</span><strong id="progress-percent">۰٪</strong></div><div class="progress-track" role="progressbar" aria-label="درصد تکمیل ددلاین‌ها" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div></section>
          </aside>
        </div>
      </div>
    </main>
  </div>
  <dialog id="assignment-dialog" aria-labelledby="dialog-title">
    <form id="assignment-form">
      <div class="dialog-heading"><h2 id="dialog-title">افزودن ددلاین</h2><button type="button" class="icon-button" id="close-dialog" aria-label="بستن">×</button></div>
      <input type="hidden" id="assignment-id">
      <label>عنوان <input id="assignment-title" required maxlength="160" placeholder="مثلاً: امتحان ریاضی" dir="auto"></label>
      <div class="form-row">
        <label>نام درس <select id="assignment-course" required dir="ltr"><option value="">انتخاب درس</option><option value="ML">ML</option><option value="NC">NC</option><option value="OS">OS</option><option value="AUTOMATA">AUTOMATA</option><option value="PRESENTATION">PRESENTATION</option><option value="WORK">WORK</option><option value="Other">Other</option></select></label>
        <label>نوع فعالیت <select id="assignment-type"><option value="Assignment">تکلیف</option><option value="Exam">امتحان</option><option value="Quiz">کوییز</option><option value="Project">پروژه</option><option value="Reading">مطالعه</option><option value="Other">سایر</option></select></label>
      </div>
      <label id="custom-course-label" hidden>نام درس (Other) <input id="assignment-course-other" maxlength="80" placeholder="نام درس را وارد کن" dir="auto" disabled></label>
      <fieldset class="due-fields">
        <legend id="due-label">تاریخ و ساعت ددلاین</legend>
        <div class="due-inputs">
          <label>تاریخ شمسی <span class="date-input-wrap"><input id="assignment-due" type="text" inputmode="numeric" required maxlength="10" placeholder="۱۴۰۵/۰۸/۰۱" dir="ltr" autocomplete="off" aria-label="تاریخ شمسی" aria-describedby="date-error timezone-note"><button type="button" id="toggle-date-picker" aria-label="انتخاب تاریخ شمسی" aria-expanded="false" aria-controls="date-picker"><svg class="icon"><use href="#i-calendar"/></svg></button></span></label>
          <label>ساعت <input id="assignment-time" type="time" required step="60" dir="ltr"></label>
        </div>
        <div class="date-picker" id="date-picker" role="group" aria-label="تقویم انتخاب تاریخ شمسی" hidden>
          <div class="month-heading"><strong id="date-picker-title" aria-live="polite"></strong><div class="month-navigation"><button type="button" id="date-picker-previous" aria-label="ماه قبل در انتخاب تاریخ">‹</button><button type="button" id="date-picker-next" aria-label="ماه بعد در انتخاب تاریخ">›</button></div></div>
          <div class="month-weekdays" aria-hidden="true"><span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span></div>
          <div id="date-picker-days" class="date-picker-days"></div><button type="button" id="date-picker-today">امروز</button>
        </div>
        <small id="date-error" class="error" role="status" hidden></small><small id="timezone-note"></small>
      </fieldset>
      <label>یادداشت <textarea id="assignment-notes" maxlength="4000" rows="3" placeholder="جزئیات یا لینک…" dir="auto"></textarea></label>
      <label class="file-drop"><svg class="icon"><use href="#i-upload"/></svg><strong>افزودن فایل</strong><span>حداکثر ۲۵ مگابایت برای هر فایل</span><input id="assignment-files" type="file" multiple aria-label="انتخاب فایل‌های پیوست"></label>
      <div id="form-files" class="form-files"></div><p id="form-error" class="error" role="alert"></p>
      <div class="dialog-actions"><button type="submit" class="button primary" id="save-button">ذخیرهٔ ددلاین</button><button type="button" class="button secondary" id="cancel-dialog">انصراف</button></div>
    </form>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title">این ددلاین حذف شود؟</h2><p id="confirm-message"></p><div class="dialog-actions"><button class="button danger" value="confirm">حذف ددلاین</button><button class="button secondary" value="cancel">انصراف</button></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
